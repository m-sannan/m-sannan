<svg width="400" height="170" viewBox="0 0 400 170" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges" role="img" aria-label="OthersPe - Fintech UPI Project">
  <!-- Outer Frame -->
  <rect width="400" height="170" rx="8" fill="#000000" stroke="#00A800" stroke-width="3"/>
  <rect x="5" y="5" width="390" height="160" rx="6" fill="#111827" stroke="#1F2937" stroke-width="1"/>
  <rect x="5" y="5" width="8" height="160" fill="#00A800"/>

  <g font-family="'Courier New', Courier, Monaco, monospace" font-weight="900">
    <!-- Header Title -->
    <text x="26" y="34" font-size="20" fill="#FFFFFF">&#129689; OthersPe</text>
    
    <!-- Tag Pill -->
    <rect x="250" y="18" width="132" height="22" rx="4" fill="#0A2E12" stroke="#00A800" stroke-width="1.5"/>
    <text x="316" y="33" text-anchor="middle" font-size="10" fill="#80D010">FINTECH &#183; UPI</text>

    <!-- Description Lines -->
    <text x="26" y="66" font-size="12" font-weight="normal" fill="#F1F5F9">
      Scan any merchant or personal UPI QR,
    </text>
    <text x="26" y="84" font-size="12" font-weight="normal" fill="#F1F5F9">
      set exact &#8377; amount, and share a zero-server
    </text>
    <text x="26" y="102" font-size="12" font-weight="normal" fill="#94A3B8">
      pay-link for others to pay via any UPI app.
    </text>

    <!-- Bottom Action Pill Bar -->
    <rect x="26" y="122" width="356" height="30" rx="4" fill="#182234" stroke="#00A800" stroke-width="1"/>
    <text x="204" y="142" text-anchor="middle" font-size="11" fill="#80D010">
      &#9654; 1-CLICK SPLIT PAY &#183; ZERO SERVER
    </text>
  </g>
</svg>
