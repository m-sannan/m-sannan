<svg width="800" height="200" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges" role="img" aria-label="Sannan — Product Manager, Designer">
  <defs>
    <pattern id="brick" width="32" height="16" patternUnits="userSpaceOnUse">
      <rect width="32" height="16" fill="#C84C0C"/>
      <rect width="32" height="2" fill="#5A1E08"/>
      <rect x="15" y="2" width="2" height="14" fill="#5A1E08"/>
      <rect y="8" width="32" height="2" fill="#5A1E08"/>
      <rect y="10" width="2" height="6" fill="#5A1E08"/>
      <rect x="30" y="10" width="2" height="6" fill="#5A1E08"/>
      <rect x="2" y="2" width="12" height="5" fill="#E67A22"/>
      <rect x="18" y="2" width="12" height="5" fill="#E67A22"/>
      <rect x="2" y="11" width="27" height="4" fill="#E67A22"/>
      <animateTransform attributeName="patternTransform" type="translate" from="0,0" to="32,0" dur="2.5s" repeatCount="indefinite"/>
    </pattern>
  </defs>

  <rect width="800" height="200" fill="#8B8CFF"/>

  <g fill="#FFFFFF">
    <g transform="translate(40,20)"><rect x="16" y="10" width="56" height="10"/><rect x="8" y="16" width="80" height="10"/><rect x="24" y="4" width="32" height="8"/></g>
    <g transform="translate(320,34)"><rect x="12" y="8" width="40" height="8"/><rect x="4" y="14" width="60" height="8"/><rect x="16" y="2" width="24" height="8"/></g>
    <g transform="translate(600,16)"><rect x="16" y="10" width="56" height="10"/><rect x="8" y="16" width="80" height="10"/><rect x="24" y="4" width="32" height="8"/></g>
    <g transform="translate(840,20)"><rect x="16" y="10" width="56" height="10"/><rect x="8" y="16" width="80" height="10"/><rect x="24" y="4" width="32" height="8"/></g>
    <g transform="translate(1120,34)"><rect x="12" y="8" width="40" height="8"/><rect x="4" y="14" width="60" height="8"/><rect x="16" y="2" width="24" height="8"/></g>
    <g transform="translate(1400,16)"><rect x="16" y="10" width="56" height="10"/><rect x="8" y="16" width="80" height="10"/><rect x="24" y="4" width="32" height="8"/></g>
    <animateTransform attributeName="transform" type="translate" values="0,0;-800,0" dur="20s" repeatCount="indefinite"/>
  </g>

  <g>
    <rect width="26" height="26" fill="#F0C030" stroke="#7A3A00" stroke-width="2"/>
    <text x="13" y="19" text-anchor="middle" font-family="Courier New, monospace" font-size="17" font-weight="700" fill="#7A3A00">?</text>
    <animateTransform attributeName="transform" type="translate" values="60,110;60,102;60,110" dur="1.3s" repeatCount="indefinite"/>
  </g>
  <g>
    <rect width="26" height="26" fill="#F0C030" stroke="#7A3A00" stroke-width="2"/>
    <text x="13" y="19" text-anchor="middle" font-family="Courier New, monospace" font-size="17" font-weight="700" fill="#7A3A00">?</text>
    <animateTransform attributeName="transform" type="translate" values="700,90;700,82;700,90" dur="1.5s" begin="0.4s" repeatCount="indefinite"/>
  </g>

  <g text-anchor="middle" font-family="Courier New, monospace" font-weight="700">
    <text x="402" y="92" font-size="36" fill="#5A1E08">SANNAN</text>
    <text x="400" y="90" font-size="36" fill="#F4E4B8">SANNAN</text>
    <text x="402" y="122" font-size="14" fill="#5A1E08">WORLD 1-1 PRODUCT MANAGER  ·  WORLD 1-2 DESIGNER</text>
    <text x="400" y="120" font-size="14" fill="#F6D7A7">WORLD 1-1 PRODUCT MANAGER  ·  WORLD 1-2 DESIGNER</text>
  </g>

  <rect x="0" y="168" width="800" height="32" fill="url(#brick)"/>
</svg>
