<svg width="400" height="170" viewBox="0 0 400 170" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges" role="img" aria-label="StayCheck - Chrome Extension Project">
  <!-- Outer Frame -->
  <rect width="400" height="170" rx="8" fill="#000000" stroke="#A855F7" stroke-width="3"/>
  <rect x="5" y="5" width="390" height="160" rx="6" fill="#111827" stroke="#1F2937" stroke-width="1"/>
  <rect x="5" y="5" width="8" height="160" fill="#A855F7"/>

  <g font-family="'Courier New', Courier, Monaco, monospace" font-weight="900">
    <!-- Header Title -->
    <text x="26" y="34" font-size="20" fill="#FFFFFF">&#128269; StayCheck</text>
    
    <!-- Tag Pill -->
    <rect x="250" y="18" width="132" height="22" rx="4" fill="#2E1848" stroke="#A855F7" stroke-width="1.5"/>
    <text x="316" y="33" text-anchor="middle" font-size="10" fill="#C084FC">CHROME EXT</text>

    <!-- Description Lines -->
    <text x="26" y="66" font-size="12" font-weight="normal" fill="#F1F5F9">
      Cross-checks hotel property listings on
    </text>
    <text x="26" y="84" font-size="12" font-weight="normal" fill="#F1F5F9">
      Booking &amp; Agoda against verified Google
    </text>
    <text x="26" y="102" font-size="12" font-weight="normal" fill="#94A3B8">
      Maps reviews and ratings before booking.
    </text>

    <!-- Bottom Action Pill Bar -->
    <rect x="26" y="122" width="356" height="30" rx="4" fill="#182234" stroke="#A855F7" stroke-width="1"/>
    <text x="204" y="142" text-anchor="middle" font-size="11" fill="#C084FC">
      &#9654; CHROME STORE &#183; LIVE OVERLAY
    </text>
  </g>
</svg>
